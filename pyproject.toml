[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dir-digest"
version = "0.1.0"
description = "One content hash for a directory tree, with gitignore-style ignores"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["hash", "digest", "directory", "reproducible", "cache-key", "gitignore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
dir-digest = "dir_digest.__main__:main"

[project.urls]
Homepage = "https://github.com/sandeshbagmare/dir-digest"
Issues = "https://github.com/sandeshbagmare/dir-digest/issues"
Changelog = "https://github.com/sandeshbagmare/dir-digest/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dir_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
